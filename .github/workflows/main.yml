name: Build Release AAB

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Clean and Install Dependencies
        run: |
          cd cosmicbreadcrumbs
          rm -rf node_modules package-lock.json
          npm install

      - name: Build Web Assets
        run: |
          cd cosmicbreadcrumbs
          npm run build --if-present

      - name: Clean Termux Gradle Config & Sync Capacitor
        run: |
          cd cosmicbreadcrumbs
          # Remove local Termux AAPT2 override if present
          if [ -f android/gradle.properties ]; then
            sed -i '/android.aapt2FromMavenOverride/d' android/gradle.properties
          fi
          # Create missing Cordova variables file if required by capacitor.build.gradle
          mkdir -p android/capacitor-cordova-android-plugins
          touch android/capacitor-cordova-android-plugins/cordova.variables.gradle
          npx --yes @capacitor/cli sync android

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Make Gradlew Executable
        run: chmod +x cosmicbreadcrumbs/android/gradlew

      - name: Build Android App Bundle (.aab)
        run: |
          cd cosmicbreadcrumbs/android
          ./gradlew bundleRelease

      - name: Upload Release AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-bundle
          path: cosmicbreadcrumbs/android/app/build/outputs/bundle/release/*.aab
