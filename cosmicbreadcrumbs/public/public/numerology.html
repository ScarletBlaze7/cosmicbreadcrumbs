



<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Numerology - From the Universe</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400..900&display=swap" rel="stylesheet">
  
  <style>
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.35; transform: scale(1) translate(-50%, -50%); }
      50% { opacity: 0.75; transform: scale(1.1) translate(-45%, -48%); }
    }
    @keyframes floatCard {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    @keyframes shootingStar {
      0% { transform: translateX(0) translateY(0); opacity: 1; }
      100% { transform: translateX(-150px) translateY(150px); opacity: 0; }
    }
    .animate-pulse-glow { animation: pulseGlow 8s ease-in-out infinite; }
    .animate-float { animation: floatCard 6s ease-in-out infinite; }
    .shooting-star {
      position: absolute;
      width: 80px;
      height: 1px;
      background: linear-gradient(90deg, rgba(255,255,255,1), transparent);
      transform: rotate(-45deg);
      animation: shootingStar 3s ease-in-out infinite;
    }
    .bg-grid-pattern {
      background-image: radial-gradient(rgba(255, 255, 255, 0.1) 1px, transparent 1px);
      background-size: 24px 24px;
    }
  </style>
</head>
<body class="bg-[#020208] text-white font-['Orbitron',sans-serif] min-h-screen pb-28 overflow-x-hidden antialiased flex flex-col items-center justify-between">

  <!-- Ambient Animated Background Layer with Shooting Stars -->
  <div class="fixed inset-0 pointer-events-none isolate z-0 overflow-hidden">
    <div class="absolute inset-0 bg-grid-pattern opacity-25"></div>
    <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[min(520px,72vw)] h-[min(520px,72vw)] bg-purple-600/20 rounded-full blur-[120px] animate-pulse-glow"></div>
    <div class="absolute top-1/3 left-1/2 -translate-x-1/2 w-[min(380px,50vw)] h-[min(380px,50vw)] bg-indigo-500/15 rounded-full blur-[90px] animate-pulse-glow" style="animation-delay: -3s;"></div>
    <!-- Shooting Star Effects -->
    <div class="shooting-star top-[12%] right-[20%]" style="animation-delay: 2s;"></div>
    <div class="shooting-star top-[35%] right-[80%]" style="animation-delay: 5s;"></div>
  </div>

  <!-- Top Header Section -->
  <header class="relative z-10 w-full pt-8 px-6 text-center">
    <span class="text-[10px] uppercase tracking-[0.5em] text-purple-400 font-bold block mb-1.5 drop-shadow-[0_0_10px_rgba(168,85,247,0.6)]">
      From
    </span>
    <h1 class="text-3xl md:text-4xl font-extrabold tracking-[0.25em] text-transparent bg-clip-text bg-gradient-to-r from-white via-purple-200 to-indigo-400 uppercase leading-none drop-shadow-[0_0_25px_rgba(168,85,247,0.4)]">
      The Universe
    </h1>
    <p class="text-[11px] tracking-widest text-white/70 mt-2.5 uppercase font-medium">
      Calculate your core numbers and destiny path
    </p>
    <div class="w-24 h-[2px] bg-gradient-to-r from-transparent via-purple-400 to-transparent mx-auto mt-3.5 shadow-[0_0_12px_rgba(168,85,247,0.7)]"></div>
  </header>

  <!-- Main Content Area -->
  <main class="relative z-10 flex flex-col items-center justify-center px-4 my-auto w-full max-w-md gap-6 mt-6">
    <div class="relative p-[1px] rounded-2xl overflow-hidden bg-gradient-to-b from-white/20 via-indigo-500/20 to-transparent w-full shadow-2xl animate-float">
      <div class="relative z-10 bg-[#020208]/90 backdrop-blur-xl rounded-2xl p-6 border border-white/10 flex flex-col items-center gap-4 text-center">
        
        <span class="text-[9px] uppercase tracking-[0.45em] text-purple-400 font-semibold">
          Life Path
        </span>
        <h3 class="text-sm font-bold tracking-widest text-white uppercase">
          Discover Your Number
        </h3>
        
        <p class="text-xs text-white/70 tracking-wide font-sans leading-relaxed mb-2">
          Your life path number reveals your ultimate purpose and the traits you carry throughout your journey.
        </p>

        <button class="w-full py-3 rounded-full bg-white/5 hover:bg-white/10 border border-white/15 text-xs font-mono uppercase tracking-[0.2em] transition-all duration-300 hover:border-purple-500/50">
          Begin Calculation
        </button>

      </div>
    </div>
  </main>

  <!-- Bottom Navigation Bar -->
  <nav class="fixed bottom-0 left-0 right-0 z-50 bg-[#07070f]/90 backdrop-blur-lg border-t border-white/10 px-2 py-3 flex justify-around items-center text-[9px] uppercase tracking-wider text-white/50">
    <a href="index.html" class="flex flex-col items-center gap-1 hover:text-white transition-colors">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
      <span>Daily Zodiac</span>
    </a>
    <a href="#" class="flex flex-col items-center gap-1 hover:text-white transition-colors">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.286-6.857L5 12l5.714-2.143L13 3z"></path></svg>
      <span>Oracle</span>
    </a>
    <a href="numerology.html" class="flex flex-col items-center gap-1 text-purple-400 font-semibold">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
      <span>Life Path</span>
    </a>
    <a href="#" class="flex flex-col items-center gap-1 hover:text-white transition-colors">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"></path></svg>
      <span>Advice</span>
    </a>
    <a href="profile.html" class="flex flex-col items-center gap-1 hover:text-white transition-colors">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
      <span>Me</span>
    </a>
  </nav>

</body>
</html>
