
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Welcome - From the Universe</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400..900&display=swap" rel="stylesheet">
  
  <style>
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.35; transform: scale(1) translate(-50%, -50%); }
      50% { opacity: 0.75; transform: scale(1.1) translate(-45%, -48%); }
    }
    @keyframes beamMove {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(100%); }
    }
    @keyframes floatCard {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    @keyframes rotateGradient {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes shootingStar {
      0% { transform: translateX(0) translateY(0); opacity: 1; }
      100% { transform: translateX(-150px) translateY(150px); opacity: 0; }
    }
    .animate-pulse-glow { animation: pulseGlow 8s ease-in-out infinite; }
    .animate-beam { animation: beamMove 4s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
    .animate-float { animation: floatCard 6s ease-in-out infinite; }
    .animate-spin-slow { animation: rotateGradient 12s linear infinite; }
    .shooting-star {
      position: absolute;
      width: 80px;
      height: 1px;
      background: linear-gradient(90deg, rgba(255,255,255,1), transparent);
      transform: rotate(-45deg);
      animation: shootingStar 3s ease-in-out infinite;
    }
    .bg-grid-pattern {
      background-image: radial-gradient(rgba(255, 255, 255, 0.1) 1px, transparent 1px);
      background-size: 24px 24px;
    }
  </style>
</head>
<body class="bg-[#020208] text-white font-['Orbitron',sans-serif] min-h-screen p-6 overflow-x-hidden antialiased flex flex-col items-center justify-center">

  <!-- Ambient Animated Background Layer with Shooting Stars -->
  <div class="fixed inset-0 pointer-events-none isolate z-0 overflow-hidden">
    <div class="absolute inset-0 bg-grid-pattern opacity-25"></div>
    <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[min(520px,72vw)] h-[min(520px,72vw)] bg-purple-600/20 rounded-full blur-[120px] animate-pulse-glow"></div>
    <div class="absolute top-1/3 left-1/2 -translate-x-1/2 w-[min(380px,50vw)] h-[min(380px,50vw)] bg-indigo-500/15 rounded-full blur-[90px] animate-pulse-glow" style="animation-delay: -3s;"></div>
    <!-- Shooting Star Effects -->
    <div class="shooting-star top-[10%] right-[15%]" style="animation-delay: 1s;"></div>
    <div class="shooting-star top-[25%] right-[70%]" style="animation-delay: 4s;"></div>
  </div>

  <!-- Top Header Section -->
  <header class="relative z-10 w-full pt-4 px-2 text-center mb-6">
    <span class="text-[10px] uppercase tracking-[0.5em] text-purple-400 font-bold block mb-1.5 drop-shadow-[0_0_10px_rgba(168,85,247,0.6)]">
      From
    </span>
    <h1 class="text-3xl md:text-4xl font-extrabold tracking-[0.25em] text-transparent bg-clip-text bg-gradient-to-r from-white via-purple-200 to-indigo-400 uppercase leading-none drop-shadow-[0_0_25px_rgba(168,85,247,0.4)]">
      The Universe
    </h1>
    <p class="text-[11px] tracking-widest text-white/70 mt-2.5 uppercase font-medium">
      Unlock your daily celestial alignment
    </p>
    <div class="w-24 h-[2px] bg-gradient-to-r from-transparent via-purple-400 to-transparent mx-auto mt-3.5 shadow-[0_0_12px_rgba(168,85,247,0.7)]"></div>
  </header>

  <!-- Welcome Onboarding Card -->
  <main class="relative z-10 flex flex-col items-center justify-center w-full max-w-md my-auto animate-float">
    <div class="relative group p-[1px] rounded-2xl overflow-hidden bg-gradient-to-b from-white/20 via-purple-500/20 to-transparent w-full shadow-2xl">
      <div class="absolute inset-0 z-0 opacity-40 blur-md bg-[radial-gradient(circle_at_50%_0%,rgba(124,58,237,0.5),transparent_70%)] animate-spin-slow"></div>

      <div class="relative z-10 bg-[#020208]/90 backdrop-blur-xl rounded-2xl p-6 border border-white/10 flex flex-col items-center gap-4 text-center">
        <div class="absolute top-0 left-0 right-0 h-[1.8px] overflow-hidden rounded-t-2xl">
          <div class="w-full h-full bg-gradient-to-r from-transparent via-[#7c3aed] to-transparent animate-beam"></div>
        </div>

        <span class="text-[9px] uppercase tracking-[0.45em] text-purple-400 font-semibold">
          Membership Access
        </span>

        <h2 class="text-lg font-bold tracking-widest text-white uppercase">
          3-Day Free Trial
        </h2>

        <p class="text-xs text-white/70 tracking-wide font-mono leading-relaxed">
          Then <span class="text-white font-bold">$4.99/month</span> or <span class="text-white font-bold">$49.99/year</span>. Cancel anytime.
        </p>

        <!-- Routes directly to index.html -->
        <a href="index.html" class="w-full mt-2 py-3 rounded-full bg-gradient-to-r from-purple-600 to-indigo-600 text-white text-xs font-mono uppercase tracking-[0.2em] transition-all duration-300 shadow-[0_0_20px_rgba(124,58,237,0.4)] hover:shadow-[0_0_25px_rgba(124,58,237,0.7)] text-center block">
          Start Free Trial
        </a>

        <a href="index.html" class="text-[10px] text-white/40 uppercase tracking-widest hover:text-white/70 transition-colors mt-1">
          Restore / Continue Free
        </a>
      </div>
    </div>
  </main>

</body>
</html>
